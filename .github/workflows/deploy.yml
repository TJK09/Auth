name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/app
            git pull origin main

            docker build -t auth-backend ./login-backend
            docker build -t auth-frontend ./auth

            docker rm -f backend frontend || true

            docker run -d --name backend --restart unless-stopped \
              -p 5000:5000 --env-file ~/app/login-backend/.env auth-backend
            docker run -d --name frontend --restart unless-stopped \
              -p 3000:3000 auth-frontend